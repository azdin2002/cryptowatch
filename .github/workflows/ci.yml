
name: CryptoWatch CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Dependency security audit
      - name: npm security audit
        run: npm audit --audit-level=high

      # 5. Code quality
      - name: Run ESLint
        run: npm run lint

      # 6. TypeScript
      - name: TypeScript check
        run: npx tsc --noEmit

      # 7. Production build
      - name: Build project
        run: npm run build

      # 8. Semgrep SAST
      - name: Semgrep SAST Scan
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            semgrep/semgrep \
            semgrep scan --config auto --json \
            --output /src/semgrep-report.json /src

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 14

      # Trivy runs only on pushes to main and PRs targeting main.

      # 9. Build Docker image
      - name: Build Docker image for Trivy
        id: docker_build_trivy
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          mkdir -p trivy-reports

          IMAGE_TAG="cryptowatch-ci:${GITHUB_SHA}"
          docker build --pull -t "$IMAGE_TAG" .
          docker save --output trivy-reports/cryptowatch-image.tar "$IMAGE_TAG"

      # 10. Trivy image scan
      - name: Scan Docker image with Trivy
        id: trivy_image
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            aquasec/trivy:0.76.0 image \
            --input /work/trivy-reports/cryptowatch-image.tar \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --format json \
            --output /work/trivy-reports/trivy-image-report.json \
            --exit-code 1

      # 11. Trivy repository and Dockerfile scan
      - name: Scan repository and Dockerfile with Trivy
        id: trivy_repository
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            aquasec/trivy:0.76.0 fs \
            --scanners misconfig,secret \
            --severity HIGH,CRITICAL \
            --skip-dirs /work/.git \
            --skip-dirs /work/node_modules \
            --skip-dirs /work/.next \
            --skip-dirs /work/trivy-reports \
            --format json \
            --output /work/trivy-reports/trivy-repository-report.json \
            --exit-code 1 \
            /work

      # 12. Upload Trivy reports
      - name: Upload Trivy reports
        if: always() && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main'))
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-${{ github.run_id }}
          path: trivy-reports/*.json
          if-no-files-found: warn
          retention-days: 14

      # 13. Security gate
      - name: Enforce Trivy HIGH and CRITICAL security gate
        if: always() && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main'))
        env:
          IMAGE_SCAN: ${{ steps.trivy_image.outcome }}
          REPOSITORY_SCAN: ${{ steps.trivy_repository.outcome }}
        run: |
          FAILED=0

          if [ "$IMAGE_SCAN" != "success" ]; then
            echo "::error::Docker image scan failed"
            FAILED=1
          fi

          if [ "$REPOSITORY_SCAN" != "success" ]; then
            echo "::error::Repository/configuration/secrets scan failed"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Trivy security gate FAILED"
            exit 1
          fi

          echo "Trivy security gate PASSED"
          echo "No HIGH or CRITICAL findings detected."
