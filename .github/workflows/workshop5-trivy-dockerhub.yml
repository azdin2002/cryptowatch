name: Workshop 5 - Trivy Security Gate and Docker Hub Publish

on:
  push:
    branches:
      - workshop5-GR5
  pull_request:
    branches:
      - workshop5-GR5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-publish:
    name: Test, build, scan, and publish CryptoWatch
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build locally first. The image is not published until both Trivy scans pass.
      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cryptowatch:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image for vulnerabilities and embedded secrets
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cryptowatch:${{ github.sha }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: trivy-image-report.txt
          timeout: 15m

      - name: Scan repository and Dockerfile for misconfigurations and secrets
        id: trivy-filesystem
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          skip-dirs: node_modules,.git,.next,actions-runner,trivy-reports
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: trivy-filesystem-report.txt
          timeout: 15m

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workshop5-trivy-reports
          path: |
            trivy-image-report.txt
            trivy-filesystem-report.txt
          if-no-files-found: ignore
          retention-days: 14

      # Explicit gate: a failed Trivy scan prevents every publishing step below.
      - name: Enforce HIGH and CRITICAL security gate
        if: always()
        env:
          IMAGE_SCAN_OUTCOME: ${{ steps.trivy-image.outcome }}
          FILESYSTEM_SCAN_OUTCOME: ${{ steps.trivy-filesystem.outcome }}
        run: |
          echo "Image scan: $IMAGE_SCAN_OUTCOME"
          echo "Filesystem scan: $FILESYSTEM_SCAN_OUTCOME"
          if [ "$IMAGE_SCAN_OUTCOME" != "success" ] || [ "$FILESYSTEM_SCAN_OUTCOME" != "success" ]; then
            echo "Security gate failed. Docker image will NOT be published."
            exit 1
          fi
          echo "Security gate passed. Image is eligible for publication."

      - name: Validate Docker Hub credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/workshop5-GR5'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in GitHub Actions secrets."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/workshop5-GR5'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and publish the scanned image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/workshop5-GR5'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/cryptowatch"
          docker tag "cryptowatch:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "cryptowatch:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "Published ${IMAGE}:${GITHUB_SHA}"
          echo "Published ${IMAGE}:latest"
