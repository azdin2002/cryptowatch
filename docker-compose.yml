name: cryptowatch

services:
  mongodb:
    image: mongo:7
    container_name: cryptowatch-mongodb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: cryptowatch-mongo-express
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb

  sonarqube:
    image: sonarqube:community
    container_name: cryptowatch-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

  app:
    image: cryptowatch:local
    container_name: cryptowatch-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3002:3000"
    env_file:
      - .env.local
    depends_on:
      - mongodb

volumes:
  mongodb_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
